packages:
  - apps/*
  - packages/*

# Product plugins declare Harness seams as peers, while development resolves
# them through explicit submodule links. Never auto-install a registry DSH peer.
autoInstallPeers: false

supportedArchitectures:
  cpu:
    - arm64
    - x64

allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": false
  electron: true
  electron-winstaller: false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
