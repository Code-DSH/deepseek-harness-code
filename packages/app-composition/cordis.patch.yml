# deepseek-harness-composition bundle layer: the app-managed composition
# entries, applied through the public plugin patch path at `dsh plugin add`
# time. The user's own profile patch layer is never read or modified here.
- insert:
    # The bundled everything server validates the MCP bridge but is not a
    # production capability. Keep it available for an explicit user profile
    # override without adding a test-server process to desktop startup.
    - id: mcp-everything
      name: "@deepseek-ai/dsh-mcp-client"
      disabled: true
      config:
        serverName: everything
        transport: stdio
        command: dsh-mcp-everything
    # Context7 MCP remains available as an explicit profile override, but a
    # remote connection must never sit on the desktop's startup critical path.
    # Set this row to `disabled: false` in a user patch to opt in.
    - id: mcp-context7
      name: "@deepseek-ai/dsh-mcp-client"
      disabled: true
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
