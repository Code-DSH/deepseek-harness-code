<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DeepSeek Harness Code</title>
    <style>
      :root {
        color: #171717;
        background: #fff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: inherit;
      }

      main {
        height: 100%;
        display: grid;
        place-content: center;
        gap: 18px;
        padding: 24px 36px;
      }

      p {
        margin: 0;
        text-align: center;
        font-size: 15px;
        line-height: 1.5;
      }

      progress {
        width: 320px;
        height: 8px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: #f4f4f4;
          background: #171717;
        }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite" aria-busy="true">
      <p>
        首次启动需要安装依赖，请稍候。<br />
        预计需要 5–10 分钟，具体取决于网络速度。
      </p>
      <progress aria-label="正在安装依赖"></progress>
    </main>
  </body>
</html>
