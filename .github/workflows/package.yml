name: Package DeepSeek Harness Code

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            package-kind: nsis
            expected-architecture: x64
            os: windows-2025
            command: pnpm exec electron-builder --win nsis --x64 --publish never
          - label: windows-arm64
            package-kind: nsis
            expected-architecture: arm64
            os: windows-11-arm
            command: pnpm exec electron-builder --win nsis --arm64 --publish never
          - label: macos-universal
            package-kind: dmg-zip
            expected-architecture: universal
            os: macos-15
            command: pnpm exec electron-builder --mac dmg zip --universal --publish never
          - label: linux-x64
            package-kind: appimage-deb
            expected-architecture: x64
            os: ubuntu-24.04
            command: pnpm exec electron-builder --linux AppImage deb --x64 --publish never
          - label: linux-arm64
            package-kind: appimage-deb
            expected-architecture: arm64
            os: ubuntu-24.04-arm
            command: pnpm exec electron-builder --linux AppImage deb --arm64 --publish never
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MATRIX_LABEL: ${{ matrix.label }}
      PACKAGE_KIND: ${{ matrix.package-kind }}
      EXPECTED_ARCHITECTURE: ${{ matrix.expected-architecture }}
      EVIDENCE_ROOT: ${{ github.workspace }}/release/evidence/${{ matrix.label }}
      SMOKE_TIMEOUT_MS: 600000
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record maintained Harness gitlink
        shell: bash
        run: mkdir -p build && git rev-parse HEAD:deps/deepseek-harness > build/harness-gitlink.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            build/harness-gitlink.txt
      - run: pnpm install --frozen-lockfile
      - name: Validate tag version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
      - run: pnpm build
      - run: pnpm build:icon
      - run: pnpm preflight:runtime
      - run: ${{ matrix.command }}
      - name: Validate exact package artifacts
        shell: bash
        run: |
          set -euo pipefail
          case "$MATRIX_LABEL" in
            windows-*) patterns=("release/DeepSeek-Harness-Code-*-windows-${EXPECTED_ARCHITECTURE}-setup.exe");;
            macos-*) patterns=("release/DeepSeek-Harness-Code-*-mac-universal.dmg");;
            linux-x64) patterns=("release/DeepSeek-Harness-Code-*-linux-x86_64.AppImage" "release/DeepSeek-Harness-Code-*-linux-amd64.deb");;
            linux-arm64) patterns=("release/DeepSeek-Harness-Code-*-linux-arm64.AppImage" "release/DeepSeek-Harness-Code-*-linux-arm64.deb");;
            *) printf 'unknown matrix label: %s\n' "$MATRIX_LABEL" >&2; exit 1;;
          esac
          for pattern in "${patterns[@]}"; do
            matches=()
            while IFS= read -r match; do matches+=("$match"); done < <(compgen -G "$pattern" || true)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              printf 'expected exactly one artifact for %s, found %s\n' "$pattern" "${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            printf 'ARTIFACT=%s\n' "${matches[0]}" >> "$GITHUB_ENV"
            printf 'ARTIFACT_FILENAME=%s\n' "$(basename "${matches[0]}")" >> "$GITHUB_ENV"
          done
          if [[ "$MATRIX_LABEL" == 'macos-universal' ]]; then
            zip_matches=()
            while IFS= read -r match; do zip_matches+=("$match"); done < <(compgen -G "release/DeepSeek-Harness-Code-*-mac-universal.zip" || true)
            if [[ "${#zip_matches[@]}" -ne 1 ]]; then
              printf 'expected exactly one macOS update ZIP, found %s\n' "${#zip_matches[@]}" >&2
              printf '%s\n' "${zip_matches[@]}" >&2
              exit 1
            fi
            printf 'UPDATE_ARTIFACT=%s\n' "${zip_matches[0]}" >> "$GITHUB_ENV"
          fi
      - name: Smoke test Windows package
        if: matrix.label == 'windows-x64' || matrix.label == 'windows-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE "scripts/package-smoke-windows.ps1")
          $artifact = Get-Item $env:ARTIFACT
          $install = Join-Path $env:RUNNER_TEMP "deepseek-harness-install"
          $primaryFailure = $null
          $cleanupFailures = New-DhscCleanupFailureList
          $nodeMoves = New-DhscNodeMoveList
          $installedApplication = $null
          $packageVersion = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "package.json") -Raw | ConvertFrom-Json).version
          $expectedDisplayName = "DeepSeek Harness Code $packageVersion"

          New-Item -ItemType Directory -Force $install, $env:EVIDENCE_ROOT | Out-Null
          try {
            $installer = Start-Process -PassThru -Wait -FilePath $artifact.FullName -ArgumentList "/S", "/currentuser", "/D=$install"
            if ($installer.ExitCode -ne 0) { throw "installer.ExitCode -eq 0 required, got $($installer.ExitCode)" }
            $registryEntries = @(Get-DhscUninstallRegistryEntries -ExpectedDisplayName $expectedDisplayName)
            $installedApplication = Resolve-DhscInstalledApplication -CustomRoot $install -RegistryEntries $registryEntries -LocalAppData $env:LOCALAPPDATA -ExpectedDisplayName $expectedDisplayName
            $executable = Get-Item -LiteralPath $installedApplication.Executable
            $resources = $installedApplication.Resources
            $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            pnpm smoke:package -- --scenario runtime --matrix-label $env:MATRIX_LABEL --package-kind $env:PACKAGE_KIND --expected-architecture $env:EXPECTED_ARCHITECTURE --runner-architecture $env:EXPECTED_ARCHITECTURE --artifact-filename $env:ARTIFACT_FILENAME --executable $executable.FullName --resources $resources --inventory $executable.DirectoryName --artifact $artifact.FullName --artifact-sha256 $hash --evidence-root $env:EVIDENCE_ROOT --evidence (Join-Path $env:EVIDENCE_ROOT "smoke-evidence-windows.json")
            if ($LASTEXITCODE -ne 0) { throw "package smoke failed with exit code $LASTEXITCODE" }
            $nodePlan = @(node scripts/smoke-packaged-runtime.mjs --print-node-quarantine-paths)
            if ($LASTEXITCODE -ne 0) { throw "node quarantine planning failed" }
            Hide-DhscNodeCandidates -Candidates $nodePlan -Moves $nodeMoves -RunToken "$env:GITHUB_RUN_ID-$PID"
            pnpm smoke:package -- --scenario node-required --matrix-label $env:MATRIX_LABEL --package-kind $env:PACKAGE_KIND --expected-architecture $env:EXPECTED_ARCHITECTURE --runner-architecture $env:EXPECTED_ARCHITECTURE --artifact-filename $env:ARTIFACT_FILENAME --executable $executable.FullName --resources $resources --inventory $executable.DirectoryName --artifact $artifact.FullName --artifact-sha256 $hash --evidence-root $env:EVIDENCE_ROOT --evidence (Join-Path $env:EVIDENCE_ROOT "smoke-evidence-windows-node-required.json")
            if ($LASTEXITCODE -ne 0) { throw "package node-required smoke failed with exit code $LASTEXITCODE" }
          } catch {
            $primaryFailure = $_.Exception
          } finally {
            try {
              Restore-DhscNodeCandidates -Moves $nodeMoves
            } catch {
              Add-DhscCaughtCleanupFailure -CleanupFailures $cleanupFailures -ErrorRecord $_
            }
            if ($null -ne $installedApplication) {
              try {
                $uninstaller = Start-Process -PassThru -Wait -FilePath $installedApplication.Uninstaller -ArgumentList "/S"
                if ($uninstaller.ExitCode -ne 0) {
                  Add-DhscDirectCleanupFailure -CleanupFailures $cleanupFailures -Message "installed application uninstaller exited nonzero"
                }
              } catch {
                Add-DhscCaughtCleanupFailure -CleanupFailures $cleanupFailures -ErrorRecord $_
              }
            }
            try {
              Remove-DhscRunnerOwnedCustomRoot -CustomRoot $install -RunnerTemp $env:RUNNER_TEMP
            } catch {
              Add-DhscCaughtCleanupFailure -CleanupFailures $cleanupFailures -ErrorRecord $_
            }
            if ($null -ne $installedApplication -and $installedApplication.Source -eq "registry") {
              try {
                Assert-DhscInstalledApplicationRemoved -Application $installedApplication
              } catch {
                Add-DhscCaughtCleanupFailure -CleanupFailures $cleanupFailures -ErrorRecord $_
              }
            }
          }
          Complete-DhscPackageStep -PrimaryFailure $primaryFailure -CleanupFailures $cleanupFailures
      - name: Verify macOS Universal DMG
        if: matrix.label == 'macos-universal'
        shell: bash
        run: node scripts/verify-macos-artifact.mjs "$ARTIFACT" --universal
      - name: Extract and smoke test Linux AppImage package
        if: matrix.label == 'linux-x64' || matrix.label == 'linux-arm64'
        shell: bash
        env:
          PACKAGE_KIND: appimage
        run: |
          set -euo pipefail
          temp_root=$(mktemp -d "$RUNNER_TEMP/deepseek-harness-package.XXXXXX")
          squashfs_root="$temp_root/squashfs-root"
          node_originals=()
          node_hidden=()
          restore_system_node_candidates() {
            restore_failures=0
            for ((index=${#node_originals[@]}-1; index>=0; index--)); do
              if [[ (! -e "${node_hidden[index]}" && ! -L "${node_hidden[index]}") || -e "${node_originals[index]}" || -L "${node_originals[index]}" ]]; then
                restore_failures=$((restore_failures + 1))
              elif ! sudo mv -- "${node_hidden[index]}" "${node_originals[index]}" 2>/dev/null; then
                restore_failures=$((restore_failures + 1))
              fi
            done
            node_originals=()
            node_hidden=()
            if (( restore_failures != 0 )); then
              printf 'node quarantine cleanup failed (%s candidates)\n' "$restore_failures" >&2
              return 1
            fi
          }
          hide_system_node_candidates() {
            local index=0 candidate hidden
            for candidate in "$@"; do
              index=$((index + 1))
              hidden="${candidate}.deepseek-smoke-${GITHUB_RUN_ID}-${BASHPID:-$$}-${index}"
              if [[ -e "$hidden" || -L "$hidden" ]]; then
                printf 'node quarantine destination already exists (candidate %s)\n' "$index" >&2
                return 1
              fi
              if ! sudo mv -- "$candidate" "$hidden" 2>/dev/null; then
                printf 'failed to quarantine Node candidate %s\n' "$index" >&2
                return 1
              fi
              node_originals+=("$candidate")
              node_hidden+=("$hidden")
            done
          }
          cleanup() {
            original_exit=$?
            cleanup_exit=0
            set +e
            restore_system_node_candidates || cleanup_exit=$?
            rm -rf "$squashfs_root" "$temp_root" || cleanup_exit=$?
            if (( cleanup_exit != 0 )); then
              printf 'cleanup failed with exit code %s\n' "$cleanup_exit" >&2
            fi
            if (( original_exit != 0 )); then
              exit "$original_exit"
            fi
            exit "$cleanup_exit"
          }
          trap cleanup EXIT
          mkdir -p "$EVIDENCE_ROOT"
          appimage_arch="$EXPECTED_ARCHITECTURE"
          [[ "$appimage_arch" == x64 ]] && appimage_arch=x86_64
          appimage=$(find release -maxdepth 1 -type f -name "DeepSeek-Harness-Code-*-linux-${appimage_arch}.AppImage" -print)
          [[ "$(wc -l <<< "$appimage")" -eq 1 ]]
          appimage=$(realpath "$appimage")
          chmod +x "$appimage"
          (cd "$temp_root" && "$appimage" --appimage-extract >/dev/null)
          hash=$(sha256sum "$appimage" | cut -d' ' -f1)
          executable="$squashfs_root/deepseek-harness-code"
          [[ -x "$executable" ]]
          xvfb-run -a pnpm smoke:package -- --scenario runtime --matrix-label "$MATRIX_LABEL" --package-kind "$PACKAGE_KIND" --expected-architecture "$EXPECTED_ARCHITECTURE" --runner-architecture "$EXPECTED_ARCHITECTURE" --artifact-filename "$(basename "$appimage")" --executable "$executable" --resources "$squashfs_root/resources" --inventory "$squashfs_root" --artifact "$appimage" --artifact-sha256 "$hash" --evidence-root "$EVIDENCE_ROOT" --evidence "$EVIDENCE_ROOT/smoke-evidence-linux-appimage.json"
          node_candidate_output=$(node scripts/smoke-packaged-runtime.mjs --print-node-quarantine-paths) || { printf 'node quarantine planning failed\n' >&2; exit 1; }
          node_candidates=()
          if [[ -n "$node_candidate_output" ]]; then
            while IFS= read -r candidate; do node_candidates+=("$candidate"); done <<< "$node_candidate_output"
          fi
          hide_system_node_candidates "${node_candidates[@]}"
          xvfb-run -a pnpm smoke:package -- --scenario node-required --matrix-label "$MATRIX_LABEL" --package-kind "$PACKAGE_KIND" --expected-architecture "$EXPECTED_ARCHITECTURE" --runner-architecture "$EXPECTED_ARCHITECTURE" --artifact-filename "$(basename "$appimage")" --executable "$executable" --resources "$squashfs_root/resources" --inventory "$squashfs_root" --artifact "$appimage" --artifact-sha256 "$hash" --evidence-root "$EVIDENCE_ROOT" --evidence "$EVIDENCE_ROOT/smoke-evidence-linux-appimage-node-required.json"
      - name: Install and smoke test Linux deb package
        if: matrix.label == 'linux-x64' || matrix.label == 'linux-arm64'
        shell: bash
        env:
          PACKAGE_KIND: deb
        run: |
          set -euo pipefail
          package_installed="false"
          temp_root=$(mktemp -d "$RUNNER_TEMP/deepseek-harness-deb.XXXXXX")
          node_originals=()
          node_hidden=()
          restore_system_node_candidates() {
            restore_failures=0
            for ((index=${#node_originals[@]}-1; index>=0; index--)); do
              if [[ (! -e "${node_hidden[index]}" && ! -L "${node_hidden[index]}") || -e "${node_originals[index]}" || -L "${node_originals[index]}" ]]; then
                restore_failures=$((restore_failures + 1))
              elif ! sudo mv -- "${node_hidden[index]}" "${node_originals[index]}" 2>/dev/null; then
                restore_failures=$((restore_failures + 1))
              fi
            done
            node_originals=()
            node_hidden=()
            if (( restore_failures != 0 )); then
              printf 'node quarantine cleanup failed (%s candidates)\n' "$restore_failures" >&2
              return 1
            fi
          }
          hide_system_node_candidates() {
            local index=0 candidate hidden
            for candidate in "$@"; do
              index=$((index + 1))
              hidden="${candidate}.deepseek-smoke-${GITHUB_RUN_ID}-${BASHPID:-$$}-${index}"
              if [[ -e "$hidden" || -L "$hidden" ]]; then
                printf 'node quarantine destination already exists (candidate %s)\n' "$index" >&2
                return 1
              fi
              if ! sudo mv -- "$candidate" "$hidden" 2>/dev/null; then
                printf 'failed to quarantine Node candidate %s\n' "$index" >&2
                return 1
              fi
              node_originals+=("$candidate")
              node_hidden+=("$hidden")
            done
          }
          cleanup() {
            original_exit=$?
            cleanup_exit=0
            set +e
            restore_system_node_candidates || cleanup_exit=$?
            if [[ "$package_installed" == "true" ]] || dpkg-query -W deepseek-harness-code >/dev/null 2>&1; then
              sudo dpkg --purge deepseek-harness-code || cleanup_exit=$?
            fi
            if dpkg-query -W -f='${Status}\n' deepseek-harness-code 2>/dev/null | grep -q .; then
              printf 'cleanup failed: deepseek-harness-code remains installed\n' >&2
              cleanup_exit=1
            fi
            rm -rf "$temp_root" || cleanup_exit=$?
            if (( cleanup_exit != 0 )); then
              printf 'cleanup failed with exit code %s\n' "$cleanup_exit" >&2
            fi
            if (( original_exit != 0 )); then
              exit "$original_exit"
            fi
            exit "$cleanup_exit"
          }
          trap cleanup EXIT
          mkdir -p "$EVIDENCE_ROOT"
          deb_filename_arch="$EXPECTED_ARCHITECTURE"
          [[ "$deb_filename_arch" == x64 ]] && deb_filename_arch=amd64
          deb=$(find release -maxdepth 1 -type f -name "DeepSeek-Harness-Code-*-linux-${deb_filename_arch}.deb" -print)
          [[ "$(wc -l <<< "$deb")" -eq 1 ]]
          deb=$(realpath "$deb")
          expected_deb_arch=amd64
          [[ "$EXPECTED_ARCHITECTURE" == arm64 ]] && expected_deb_arch=arm64
          [[ "$(dpkg-deb -f "$deb" Package)" == deepseek-harness-code ]]
          [[ -n "$(dpkg-deb -f "$deb" Version)" ]]
          [[ "$(dpkg-deb -f "$deb" Architecture)" == "$expected_deb_arch" ]]
          sudo apt-get update
          sudo apt-get install -y "$deb"
          package_installed="true"
          [[ "$(dpkg-query -W -f='${Status}' deepseek-harness-code)" == "install ok installed" ]]
          desktop=$(dpkg-query -L deepseek-harness-code | awk '/\/usr\/share\/applications\/.*\.desktop$/ { print; exit }')
          [[ -n "$desktop" && -f "$desktop" ]]
          executable=$(command -v deepseek-harness-code)
          [[ -n "$executable" && -x "$executable" ]]
          executable=$(realpath "$executable")
          install_dir=$(dirname "$executable")
          resources="$install_dir/resources"
          [[ -d "$resources" ]]
          hash=$(sha256sum "$deb" | cut -d' ' -f1)
          xvfb-run -a pnpm smoke:package -- --scenario runtime --matrix-label "$MATRIX_LABEL" --package-kind "$PACKAGE_KIND" --expected-architecture "$EXPECTED_ARCHITECTURE" --runner-architecture "$EXPECTED_ARCHITECTURE" --artifact-filename "$(basename "$deb")" --executable "$executable" --resources "$resources" --inventory "$install_dir" --artifact "$deb" --artifact-sha256 "$hash" --evidence-root "$EVIDENCE_ROOT" --evidence "$EVIDENCE_ROOT/smoke-evidence-linux-deb.json"
          node_candidate_output=$(node scripts/smoke-packaged-runtime.mjs --print-node-quarantine-paths) || { printf 'node quarantine planning failed\n' >&2; exit 1; }
          node_candidates=()
          if [[ -n "$node_candidate_output" ]]; then
            while IFS= read -r candidate; do node_candidates+=("$candidate"); done <<< "$node_candidate_output"
          fi
          hide_system_node_candidates "${node_candidates[@]}"
          xvfb-run -a pnpm smoke:package -- --scenario node-required --matrix-label "$MATRIX_LABEL" --package-kind "$PACKAGE_KIND" --expected-architecture "$EXPECTED_ARCHITECTURE" --runner-architecture "$EXPECTED_ARCHITECTURE" --artifact-filename "$(basename "$deb")" --executable "$executable" --resources "$resources" --inventory "$install_dir" --artifact "$deb" --artifact-sha256 "$hash" --evidence-root "$EVIDENCE_ROOT" --evidence "$EVIDENCE_ROOT/smoke-evidence-linux-deb-node-required.json"
      - name: Upload installer artifacts
        if: always() && (matrix.label == 'windows-x64' || matrix.label == 'windows-arm64')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            release/DeepSeek-Harness-Code-*-windows-${{ matrix.expected-architecture }}-setup.exe
            release/DeepSeek-Harness-Code-*-windows-${{ matrix.expected-architecture }}-setup.exe.blockmap
          if-no-files-found: error
      - name: Upload macOS installer artifact
        if: always() && matrix.label == 'macos-universal'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            release/DeepSeek-Harness-Code-*-mac-universal.dmg
            release/DeepSeek-Harness-Code-*-mac-universal.zip
          if-no-files-found: error
      - name: Upload Linux installer artifacts
        if: always() && (matrix.label == 'linux-x64' || matrix.label == 'linux-arm64')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            release/DeepSeek-Harness-Code-*-linux-x86_64.AppImage
            release/DeepSeek-Harness-Code-*-linux-amd64.deb
            release/DeepSeek-Harness-Code-*-linux-arm64.AppImage
            release/DeepSeek-Harness-Code-*-linux-arm64.deb
          if-no-files-found: error
      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-evidence
          path: release/evidence/${{ matrix.label }}/**/*.json
          if-no-files-found: warn

  macos-smoke:
    name: Smoke ${{ matrix.label }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-15
            runner-architecture: arm64
          - label: macos-x64
            os: macos-15-intel
            runner-architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EVIDENCE_ROOT: ${{ github.workspace }}/release/evidence/${{ matrix.label }}
      SMOKE_TIMEOUT_MS: 600000
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record maintained Harness gitlink
        shell: bash
        run: mkdir -p build && git rev-parse HEAD:deps/deepseek-harness > build/harness-gitlink.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            build/harness-gitlink.txt
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: release
      - name: Install and smoke test macOS Universal package
        shell: bash
        run: |
          set -euo pipefail
          mount_root=$(mktemp -d "$RUNNER_TEMP/deepseek-harness-dmg.XXXXXX")
          applications_root=$(mktemp -d "$RUNNER_TEMP/Applications.XXXXXX")
          mounted="false"
          node_originals=()
          node_hidden=()
          restore_system_node_candidates() {
            restore_failures=0
            for ((index=${#node_originals[@]}-1; index>=0; index--)); do
              if [[ (! -e "${node_hidden[index]}" && ! -L "${node_hidden[index]}") || -e "${node_originals[index]}" || -L "${node_originals[index]}" ]]; then
                restore_failures=$((restore_failures + 1))
              elif ! sudo mv -- "${node_hidden[index]}" "${node_originals[index]}" 2>/dev/null; then
                restore_failures=$((restore_failures + 1))
              fi
            done
            node_originals=()
            node_hidden=()
            if (( restore_failures != 0 )); then
              printf 'node quarantine cleanup failed (%s candidates)\n' "$restore_failures" >&2
              return 1
            fi
          }
          hide_system_node_candidates() {
            local index=0 candidate hidden
            for candidate in "$@"; do
              index=$((index + 1))
              hidden="${candidate}.deepseek-smoke-${GITHUB_RUN_ID}-${BASHPID:-$$}-${index}"
              if [[ -e "$hidden" || -L "$hidden" ]]; then
                printf 'node quarantine destination already exists (candidate %s)\n' "$index" >&2
                return 1
              fi
              if ! sudo mv -- "$candidate" "$hidden" 2>/dev/null; then
                printf 'failed to quarantine Node candidate %s\n' "$index" >&2
                return 1
              fi
              node_originals+=("$candidate")
              node_hidden+=("$hidden")
            done
          }
          cleanup() {
            original_exit=$?
            cleanup_exit=0
            set +e
            restore_system_node_candidates || cleanup_exit=$?
            if [[ "$mounted" == "true" ]]; then
              hdiutil detach "$mount_root" || cleanup_exit=$?
            fi
            rm -rf "$mount_root" "$applications_root" || cleanup_exit=$?
            if (( original_exit != 0 )); then
              exit "$original_exit"
            fi
            exit "$cleanup_exit"
          }
          trap cleanup EXIT
          mkdir -p "$EVIDENCE_ROOT"
          dmg=$(find release -maxdepth 1 -type f -name "DeepSeek-Harness-Code-*-mac-universal.dmg" -print)
          [[ "$(wc -l <<< "$dmg")" -eq 1 ]]
          dmg=$(realpath "$dmg")
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_root"
          mounted="true"
          source_app="$mount_root/DeepSeek Harness Code.app"
          installed_app="$applications_root/DeepSeek Harness Code.app"
          [[ -d "$source_app" ]]
          ditto "$source_app" "$installed_app"
          xattr -dr com.apple.quarantine "$installed_app" 2>/dev/null || true
          executable="$installed_app/Contents/MacOS/DeepSeek Harness Code"
          resources="$installed_app/Contents/Resources"
          [[ -x "$executable" && -d "$resources" ]]
          hash=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          pnpm smoke:package -- --scenario runtime --matrix-label macos-universal --package-kind dmg --expected-architecture universal --runner-architecture ${{ matrix.runner-architecture }} --artifact-filename "$(basename "$dmg")" --executable "$executable" --resources "$resources" --inventory "$installed_app" --artifact "$dmg" --artifact-sha256 "$hash" --evidence-root "$EVIDENCE_ROOT" --evidence "$EVIDENCE_ROOT/smoke-evidence-${{ matrix.runner-architecture }}.json"
          node_candidate_output=$(node scripts/smoke-packaged-runtime.mjs --print-node-quarantine-paths) || { printf 'node quarantine planning failed\n' >&2; exit 1; }
          node_candidates=()
          if [[ -n "$node_candidate_output" ]]; then
            while IFS= read -r candidate; do node_candidates+=("$candidate"); done <<< "$node_candidate_output"
          fi
          hide_system_node_candidates "${node_candidates[@]}"
          pnpm smoke:package -- --scenario node-required --matrix-label macos-universal --package-kind dmg --expected-architecture universal --runner-architecture ${{ matrix.runner-architecture }} --artifact-filename "$(basename "$dmg")" --executable "$executable" --resources "$resources" --inventory "$installed_app" --artifact "$dmg" --artifact-sha256 "$hash" --evidence-root "$EVIDENCE_ROOT" --evidence "$EVIDENCE_ROOT/smoke-evidence-${{ matrix.runner-architecture }}-node-required.json"
      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-evidence
          path: release/evidence/${{ matrix.label }}/**/*.json
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    needs: [package, macos-smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/${VERSION}.md"
          test -f "$NOTES" || NOTES=""
          manifest_args=(
            --version "$VERSION"
            --tag "$GITHUB_REF_NAME"
            --artifacts-dir artifacts
            --output artifacts/update-manifest.json
          )
          if [ -n "$NOTES" ]; then manifest_args+=(--notes-file "$NOTES"); fi
          node scripts/generate-update-manifest.mjs "${manifest_args[@]}"
          args=(--latest --title "DeepSeek Harness Code (DHSC) ${VERSION}")
          if [ -n "$NOTES" ]; then
            args+=(--notes-file "$NOTES")
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mapfile -t release_files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name 'update-manifest.json' \) -print)
            ((${#release_files[@]} > 0))
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" --clobber
          else
            mapfile -t release_files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name 'update-manifest.json' \) -print)
            ((${#release_files[@]} > 0))
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" "${args[@]}"
          fi
